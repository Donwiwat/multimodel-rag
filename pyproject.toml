[project]
name = "car-visual-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface>=0.0.1",
    "ms-swift>=4.6.0",
    "qwen-vl-utils>=0.0.14",
    "torch>=2.6",
    "torchvision",
]

# GTX 1060 (Pascal, sm_61) needs CUDA 12.6 wheels; cu128+ dropped Pascal support.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
